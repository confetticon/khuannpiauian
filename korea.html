<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>韓國場追蹤</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8484f'/%3E%3Ccircle cx='32' cy='32' r='13' fill='white'/%3E%3C/svg%3E">
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap");
:root{
  --font:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --bg:#f6f5f2; --card:#ffffff; --ink:#1b1c1f; --mute:#6b6f76; --line:#e6e3dd; --chip:#efece6;
  --accent:#e8484f; --accent-ink:#fff; --gold:#f2c14e; --gold-soft:#fff4d6; --gap:#e9f6ea; --hol:#efe9f7; --past:#ecebe8;
  --kr:#f9dbe4; --jp:#fbe3d2; --tw:#dcefd8; --we:#d9e7f7; --fest:#e7def5; --other:#ececec;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --card:#1b1d22; --ink:#ecebe8; --mute:#9aa0a8; --line:#2a2d33; --chip:#262930;
    --accent:#ff5a5f; --gold:#e8b53a; --gold-soft:#3a3220; --gap:#1d2e22; --hol:#2c2638; --past:#1a1b1e;
    --kr:#4a2a35; --jp:#4a3326; --tw:#263d2a; --we:#233448; --fest:#352b47; --other:#2c2e33;
    --shadow:none;
  }
}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 var(--font);
  -webkit-text-size-adjust:100%}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:8px;padding:12px 0 8px}
.top .tb{min-width:0;flex:1}
.top h1{font-size:19px;margin:0;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .upd{display:block;color:var(--mute);font-size:11.5px;white-space:nowrap}
.region{flex:none;display:flex;background:var(--chip);border-radius:999px;padding:3px}
.region a{padding:5px 10px;border-radius:999px;font-size:13px;text-decoration:none;color:var(--mute);white-space:nowrap}
.region a.on{background:var(--card);color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav.tabs{display:flex;gap:4px;padding-bottom:10px}
.tab{flex:1 1 0;min-width:0;border:0;background:var(--chip);color:var(--ink);padding:8px 4px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;text-align:center}
@media (min-width:600px){nav.tabs{justify-content:flex-start}.tab{flex:none;padding:8px 16px}}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .n{opacity:.6;margin-left:4px;font-size:12px}
main{padding:14px 0 60px}
section[hidden],[hidden]{display:none!important}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.frows{display:grid;gap:8px;margin-bottom:12px}
.frow{display:flex;align-items:center;gap:8px;min-width:0}
.frow .flab{flex:none;font-size:12px;color:var(--mute);width:2.6em}
.frow .chips{flex:1}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.list{display:grid;gap:10px}
@media (min-width:760px){.list.two{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card.done{opacity:.55}
.card.fol{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft) inset,var(--shadow)}
.row1{display:flex;gap:10px;align-items:flex-start}
.when{flex:none;text-align:center;min-width:62px;padding:6px 4px;border-radius:12px;background:var(--chip)}
.when .d{font-size:18px;font-weight:700;line-height:1.1}
.when .w{font-size:11px;color:var(--mute)}
.when .t{font-size:13px;font-weight:600;margin-top:2px}
.when.soon{background:var(--accent);color:var(--accent-ink)}
.when.soon .w{color:inherit;opacity:.85}
.when .c{font-size:10.5px;margin-top:3px;padding-top:3px;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);white-space:nowrap}
.when.soon .c{font-weight:700}
.ttl{font-weight:650;font-size:15px;line-height:1.35;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);max-width:100%;overflow-wrap:anywhere}
.tag.kind-g{background:var(--accent);color:var(--accent-ink)}
.tag.kind-p{background:var(--gold);color:#3a2a00}
.tag.kind-r{background:#7b5cd6;color:#fff}
.tag.o-韓國{background:var(--kr)}.tag.o-日本{background:var(--jp)}.tag.o-台灣{background:var(--tw)}.tag.o-西洋{background:var(--we)}.tag.o-音樂祭{background:var(--fest)}
.tag.hol{background:var(--hol)}
.tag.l-zh,.ev.l-zh{background:var(--tw)}.tag.l-ko,.ev.l-ko{background:var(--kr)}.tag.l-ja,.ev.l-ja{background:var(--jp)}
.tag.l-en,.ev.l-en{background:var(--we)}.tag.l-th,.ev.l-th{background:var(--gold-soft)}.tag.l-ot,.ev.l-ot{background:var(--fest)}
.tag.st-售票中{background:var(--tw)}.tag.st-尚未開賣{background:var(--we)}.tag.st-優先購階段{background:var(--gold-soft)}.tag.st-已售完,.tag.st-售票結束{background:var(--other);color:var(--mute)}
.cd{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.cd.hot{color:var(--accent);font-weight:700}
.sub{color:var(--mute);font-size:13px;margin-top:6px;white-space:pre-line}
.mvold{opacity:.7}.mvnew{color:var(--accent);font-weight:600}.tag.mv{background:var(--gold-soft)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--mute);font-size:13px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.sched{font:12.5px/1.6 var(--font);font-variant-numeric:tabular-nums;white-space:pre-wrap;margin-top:6px;background:var(--chip);border-radius:10px;padding:8px 10px;overflow-x:auto}
.buy{display:inline-flex;align-items:center;gap:4px;margin-top:10px;background:var(--ink);color:var(--bg);text-decoration:none;padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600}
.acts{display:flex;align-items:flex-start;gap:8px;margin-top:8px}
.acts details{flex:1;min-width:0;margin-top:4px}
.acts .buy{margin:0 0 0 auto;flex:none;padding:5px 10px;font-size:12.5px}
.acts .buys{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto;flex:none}
.acts .buys .buy{margin:0}
.buy.so{background:var(--chip);color:var(--mute);font-weight:500}
.perf details{margin-top:2px}.perf summary{font-size:12.5px}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.daygrp{margin:18px 0 8px;font-weight:700;font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center}
.daygrp .hl{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--hol);color:var(--ink)}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.calhead #venue{max-width:100%;min-width:0;text-overflow:ellipsis}
.calhead h2{margin:0 6px;font-size:18px;min-width:110px;text-align:center}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mute);margin:8px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{font-size:12px;color:var(--mute);text-align:center;padding:2px 0}
.cal .hd.we{color:var(--accent)}
.cell{min-height:74px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{visibility:hidden}
.cell.past{background:var(--past);opacity:.55}
.cell.gap{background:var(--gap)}
.cell.hol{box-shadow:inset 0 0 0 2px var(--hol)}
.cell .dn{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:4px}
.cell .dn small{font-weight:500;color:var(--mute);font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev{font-size:11px;line-height:1.25;border-radius:6px;padding:2px 4px;background:var(--other);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:normal;overflow-wrap:anywhere;cursor:pointer}
.ev.o-韓國{background:var(--kr)}.ev.o-日本{background:var(--jp)}.ev.o-台灣{background:var(--tw)}.ev.o-西洋{background:var(--we)}.ev.o-音樂祭{background:var(--fest)}
.ev.fol{background:var(--gold);color:#3a2a00;font-weight:700}
@media (min-width:760px){.cell{min-height:96px}.ev{font-size:12px}}
.matrix{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:14px;background:var(--card);overscroll-behavior:contain}
.matrix thead th:first-child{z-index:3}
.matrix table{border-collapse:separate;border-spacing:0;font-size:11px;min-width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px;text-align:center;vertical-align:middle;min-width:58px}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--card);z-index:1;min-width:110px;text-align:left;font-weight:650;padding-left:8px}
.matrix thead th{position:sticky;top:0;background:var(--card);z-index:2;font-weight:600}
.matrix thead th.we{color:var(--accent)}
.matrix thead th.hol{background:var(--hol)}
.matrix td.gap{background:var(--gap)}
.matrix td.past{background:var(--past)}
.matrix .ev{-webkit-line-clamp:3}
.grp{font-size:11px;color:var(--mute);font-weight:500}
dialog{border:0;border-radius:18px;padding:0;max-width:min(520px,92vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:16px}
.dlg .x{float:right;border:0;background:var(--chip);color:var(--ink);border-radius:999px;width:30px;height:30px;font-size:16px;cursor:pointer}
footer{color:var(--mute);font-size:12px;text-align:center;padding:30px 0}
.star{flex:none;border:0;background:transparent;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;padding:2px 4px;margin:-2px -4px 0 0}
.star.on{color:var(--gold)}
.folbtn{flex:none;border:0;background:var(--gold);color:#3a2a00;border-radius:999px;padding:7px 11px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap}
@media (max-width:420px){.folbtn .fl{display:none}}
.flist{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.flist .tag{display:inline-flex;align-items:center;gap:4px;background:var(--gold-soft);font-size:13px;padding:4px 6px 4px 10px}
.flist .tag button{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:14px}
.addrow{display:flex;gap:6px}
.btn2{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btnp{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer;width:100%;margin-top:12px}
.note{font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.5}
/* computer screens: wider page, bigger text, three cards per row */
@media (min-width:1100px){
  html,body{font-size:16.5px}
  .wrap{max-width:1480px;padding:0 32px}
  .top h1{font-size:23px}.top .upd{font-size:13px}
  .tab{font-size:15.5px;padding:9px 18px}.tab .n{font-size:13.5px}
  .chip,.search,select.chip{font-size:14.5px}.frow .flab{font-size:13.5px}
  .region a{font-size:14.5px;padding:6px 14px}.folbtn{font-size:14.5px;padding:8px 14px}
  .card{padding:18px;border-radius:18px}
  .ttl{font-size:17.5px}.tag{font-size:13.5px;padding:3px 10px}
  .sub,.note,summary,.chg{font-size:14.5px}.chg-s{font-size:13.5px}
  .sched{font-size:14px}.buy,.acts .buy{font-size:14px;padding:7px 13px}
  .when{min-width:76px;padding:8px 6px}.when .d{font-size:21px}.when .w{font-size:12.5px}.when .t{font-size:15px}.when .c{font-size:12px}
  .daygrp{font-size:15.5px}
  .matrix table{font-size:13px}.matrix th,.matrix td{min-width:84px;padding:4px}
  .matrix th:first-child,.matrix td:first-child{min-width:170px}
  .grp,.legend{font-size:13px}.ev{font-size:13px}.cell{min-height:110px}.cell .dn{font-size:13.5px}
  dialog{max-width:640px}
}
@media (min-width:1360px){.list.two{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chg{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:13px;cursor:pointer}
.chg-m{flex:1;min-width:0}.chg-s{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.chg-x{flex:none;color:var(--mute);font-size:12.5px}
.vseg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;flex:none}
.vseg button{border:0;background:transparent;color:var(--mute);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.vseg button.on{background:var(--card);color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sg-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin:2px 0 10px}
.sg-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sg-legend .sg-li-x{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.sg{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);overscroll-behavior:contain}
.sg table{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.sg th,.sg td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px;vertical-align:top;min-width:108px}
.sg thead th{position:sticky;top:0;z-index:2;background:var(--card);text-align:center;font-weight:650;line-height:1.25}
.sg thead th small{font-weight:500;color:var(--mute)}
.sg thead th.we{color:var(--accent)}.sg thead th.hol{background:var(--hol)}
.sg .sg-t{position:sticky;left:0;z-index:1;background:var(--card);min-width:52px;width:52px;text-align:center;font-weight:700;vertical-align:middle}
.sg thead .sg-t{z-index:3;color:var(--mute);font-size:11px}
.sg td.past{background:var(--past)}
.sg td.sg-x{box-shadow:inset 0 0 0 2px var(--accent)}
.sg-c{display:block;width:100%;text-align:left;border:0;border-left:4px solid #888;background:var(--chip);color:var(--ink);border-radius:6px;
  padding:3px 6px;margin:0 0 4px;font:inherit;font-size:12px;line-height:1.3;cursor:pointer;overflow-wrap:anywhere}
.sg-n{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sg-c small{display:block;color:var(--mute);font-size:10.5px}
.sg-c.fol{background:var(--gold-soft);font-weight:700}
@media (min-width:1100px){.sg table{font-size:13.5px}.sg th,.sg td{min-width:130px}.sg-c{font-size:13.5px}.sg-c small{font-size:12px}}
.totop{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;width:46px;height:46px;border:0;border-radius:50%;
  background:var(--ink);color:var(--bg);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.totop.show{opacity:.9;transform:none;pointer-events:auto}
.chg-i{font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}.chg-p{color:var(--mute);font-size:12px}
</style><style>.anm{font-size:12.5px;color:var(--mute);margin-top:2px}.tag.aty{background:var(--gold-soft)}.tag.gtg{background:transparent;box-shadow:inset 0 0 0 1px var(--mute);color:var(--mute)}</style>
<style>.toplink{font-size:13px;color:var(--mute);text-decoration:none;white-space:nowrap}.kst{color:var(--mute);font-size:11px}
:root{--khol:#f8cbad}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--khol:#5a3324}}
.matrix thead th.khol{background:var(--khol)}
.cell.khol{box-shadow:inset 0 0 0 2px var(--khol)}
.cell.hol.khol{box-shadow:inset 0 0 0 2px var(--hol),inset 0 0 0 4px var(--khol)}
.tag.khol,.daygrp .hl.khol{background:var(--khol)}
.cell .dn small.k{color:#c55a11}
.matrix .otherrow td{background:var(--card)}.ev.more{background:var(--line);text-align:center;font-weight:600}</style>
</head>
<body>
<script>
window.PCOL = {'拓元':'#2f6fde','KKTIX':'#12a36b','遠大':'#d9480f','寬宏':'#8e44ad','年代':'#b7950b','ibon':'#e67e22',
  'Melon':'#00b336','NOL':'#6c5ce7','Ticketlink':'#e84393','YES24':'#0984e3'};
window.saleGrid = function(el, items, opt){
  opt = opt || {};
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2,'0'), WD = '日一二三四五六', hol = opt.hol || {};
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const days = Array.from({length: opt.days || 14}, (_, i) => new Date(t0.getFullYear(), t0.getMonth(), t0.getDate() + i));
  const end = new Date(days[days.length-1].getTime() + 864e5);
  items = items.filter(x => x.d >= t0 && x.d < end);
  if (!items.length){ el.innerHTML = `<div class="empty">未來 ${days.length} 天沒有開賣</div>`; return; }
  const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const slots = [...new Set(items.map(x => hm(x.d)))].sort();
  const cell = {};
  items.forEach((x, i) => { (cell[iso(x.d) + ' ' + hm(x.d)] ||= []).push(i); });
  const now = new Date();
  const plats = [...new Set(items.map(x => x.p))];
  let h = '<div class="sg-legend">' + plats.map(p => `<span><i style="background:${PCOL[p]||'#888'}"></i>${esc(p)}</span>`).join('') +
          '<span><i class="sg-li-x"></i>同時段 2 場以上</span><span><i style="background:var(--gold)"></i>★關注</span></div>';
  h += '<div class="sg"><table><thead><tr><th class="sg-t">開賣</th>';

  slots.forEach(t => {
    h += `<tr><th class="sg-t">${t}</th>`;
    days.forEach(d => {
      const ids = cell[iso(d) + ' ' + t] || [];

      <div style="display:flex;flex-wrap:wrap;gap:8px">${links}</div>`;
    document.getElementById('dlg').showModal();
  });
  const sc = el.querySelector('.sg');
  if (sc) sc.style.maxHeight = Math.max(320, window.innerHeight - document.querySelector('header').offsetHeight - 70) + 'px';
};

  if (e.ar && e.ar.ty) t += `<span class="tag aty">${esc(e.ar.ty)}</span>`;
  (e.tg || []).forEach(g => t += `<span class="tag gtg">${esc(g)}</span>`);
  return t;
}
function card(e, d, lab, noSt){
  const fo = isFol(e.t), hot = d && (d - new Date()) < 864e5 && d > new Date();
  const tl = e.p === 'Ticketlink' || e.p === 'YES24';   // list-only platforms: show dates, sale times on their own page
  let box;
  if (tl){ const s = d || (e.d1 ? new Date(e.d1 + 'T00:00') : null);
    box = s ? `<div class="when"><div class="d">${s.getMonth()+1}/${s.getDate()}</div><div class="w">週${W[s.getDay()]}</div><div class="w">演出</div></div>` : whenBox(null); }
  else box = whenBox(d, hot);
  return `<article class="card${fo?' fol':''}"><div class="row1">${box}
    <div style="min-width:0;flex:1"><div style="display:flex;gap:6px"><div class="ttl" style="flex:1">${esc(e.t)}</div>${starBtn(e.an)}</div>
    ${arName(e)}
    <div class="meta">${tl?'':(lab||'')}<span class="tag">${esc(e.p)}</span>${noSt||tl?'':`<span class="tag st-${esc(e.st)}">${esc(e.st)}</span>`}${arTags(e)}</div>
    <div class="sub perf">${esc(e.v||'')}${e.v&&e.perf?'\n':''}${perfHtml(e.perf)}</div>
    <div class="acts">${tl ? '<span class="note" style="flex:1;margin:4px 0 0">售票時間請點連結查看</span>' : `<details><summary>售票時程</summary><div class="sched">${esc(e.sch||'')}</div></details>`}
    ${e.u?`<a class="buy" href="${esc(e.u)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">購票 ↗</a>`:''}</div></div></div></article>`;
}
function sales(e){
  const out = [], n = new Date(Date.now() - 36e5);
  (e.sch||'').split('\n').forEach(l => { const m = l.match(/^[▶・]\s*(\d{2})\/(\d{2})\([^)]*\)\s*(\d{2}):(\d{2})(?:～\d{2}:\d{2})?\s*(.+)$/); if (!m) return;
    const g = new Date(); let y = g.getFullYear(); if (+m[1] < g.getMonth()+1-6) y++;
    const d = new Date(y, +m[1]-1, +m[2], +m[3], +m[4]); if (d > n) out.push({d, what: m[5].replace(/（韓國.*$/,'')}); });
  return out;
}

function groupShows(list){        // same venue + day: the same show sold on several sites -> one cell
  const g = [], key = s => String(s.a||s.t||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');
  // same start time, same act, or no times at all but sold on different sites
  list.forEach(s => { const hit = g.find(x => (s.tm && x[0].tm === s.tm) || key(x[0]) === key(s) ||
      (!s.tm && x.every(y => !y.tm && y.p !== s.p))); if (hit) hit.push(s); else g.push([s]); });
  return g;
}
function buyLinks(arr){
  const seen = new Set();
  arr = arr.flatMap(s => s.uu && s.uu.length ? s.uu : [s]);           // a show sold on two sites: both buttons
  const many = new Set(arr.map(s => s.p)).size > 1;
  return arr.filter(s => s.u && !seen.has(s.u) && seen.add(s.u)).map(s =>
    `<a class="buy" href="${esc(s.u)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">${many?esc(s.p)+' ':''}購票 ↗</a>`).join(' ');
}

  items.forEach(s => {
    if (s.d !== last){ last = s.d; const dt = new Date(s.d + 'T00:00');
      h += `<div class="daygrp">${dt.getMonth()+1}/${dt.getDate()}（${W[dt.getDay()]}）${D.hol[s.d]?`<span class="hl">台灣 ${esc(D.hol[s.d])}</span>`:''}${D.khol[s.d]?`<span class="hl khol">韓國 ${esc(D.khol[s.d])}</span>`:''}</div>`; }
    const fo = isFol(s.t);
    h += `<div class="card${fo?' fol':''}" style="padding:10px 12px;margin-bottom:6px" data-ev='${esc(JSON.stringify(s))}'>
      <div style="display:flex;gap:10px;align-items:baseline"><b style="min-width:42px">${esc(s.tm||'')}</b>
      <div style="min-width:0;flex:1"><div style="display:flex;gap:6px"><div class="ttl" style="font-size:14px;flex:1">${esc(s.t)}</div>${starBtn(s.an)}</div>
      <div class="meta"><span class="tag">${esc(s.v)}</span><span class="tag">${esc(s.p)}</span>${s.c?`<span class="tag kind-g">撞期</span>`:''}</div></div></div></div>`;
  });
  $('#day-list').innerHTML = h || '<div class="empty">沒有符合的演出</div>';
}
$('#day-f').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; store.set('krDayF', b.dataset.f); renderDay(); });
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x===t));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== t.dataset.tab);
  store.set('krTab', t.dataset.tab); });
const tab0 = store.get('krTab','up'); const tb = document.querySelector(`.tab[data-tab="${tab0}"]`); if (tb) tb.click();
function renderAllViews(){ renderUp(); renderNew(); renderAll(); renderCal(); renderDay(); }
renderUp(); renderNew(); renderAllF(); renderAll(); renderCal(); renderDay();
</script>
<script>
(function(){                               // "back to top" button, shown once the page is scrolled down
  const b = document.createElement('button');
  b.className = 'totop'; b.type = 'button'; b.setAttribute('aria-label', '回到最上面'); b.textContent = '↑';
  document.body.appendChild(b);
  const onScroll = () => b.classList.toggle('show', window.scrollY > 600);
  window.addEventListener('scroll', onScroll, {passive: true}); onScroll();
  b.addEventListener('click', () => {
    window.scrollTo({top: 0, behavior: 'smooth'});
    const m = document.querySelector('#calbody .matrix'); if (m) m.scrollTo({top: 0, behavior: 'smooth'});
  });
})();
(function(){
  const src = document.getElementById('data');
  const PD = src ? JSON.parse(src.textContent) : D;      // the Korea page keeps its data in a global D
  const el = document.getElementById('chg'), log = PD.log || [];
  const pad = n => String(n).padStart(2,'0');
  const when = s => { const d = new Date(s), t = new Date(); const day = d.toDateString() === t.toDateString() ? '今天' :
    `${d.getMonth()+1}/${d.getDate()}`; return `${day} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const KIND = {new:'新增', time:'開賣時間更新', sold:'已售完', back:'重新開放購票（可能釋票）', gone:'下架'};
  const sum = e => { const c = {}; e.items.forEach(i => c[i[0]] = (c[i[0]]||0) + 1);
    return Object.keys(KIND).filter(k => c[k]).map(k => `${KIND[k]} ${c[k]} 場`).join('、'); };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(checked){
    const last = log[0];
    let main, sub = '';
    if (checked && (!last || checked > last.at) && checked >= PD.generated) {
      main = `<b>${when(checked)} 檢查</b>：目前沒有新的進度`;
      if (last) sub = `上次變動 ${when(last.at)}：${sum(last)}`;
    } else if (last) {
      main = `<b>${when(last.at)} 更新</b>：${sum(last)}`;
    } else {
      main = `<b>${when(PD.generated)} 更新</b>：目前沒有新的進度`;
    }
    el.innerHTML = `<div class="chg-m">${main}${sub?`<span class="chg-s">${sub}</span>`:''}</div>${log.length?'<span class="chg-x">紀錄 ›</span>':''}`;
    el.hidden = false;
  }
  el.addEventListener('click', () => {
    if (!log.length) return;
    const dlg = document.getElementById('dlg'), b = document.getElementById('dlgb');
    b.innerHTML = `<button class="x" onclick="this.closest('dialog').close()">✕</button><div class="ttl" style="font-size:17px">更新紀錄</div>` +
      log.map(e => `<div class="daygrp">${when(e.at)}｜${sum(e)}</div>` + e.items.map(i =>
        `<div class="chg-i"><span class="tag">${KIND[i[0]]}</span> ${esc(i[2])} <span class="chg-p">${esc(i[1])}${i[3]?'｜'+esc(i[3]):''}</span></div>`).join('') +
        (e.more ? `<div class="note">…還有 ${e.more} 場</div>` : '')).join('');
    dlg.showModal();
  });
  render(null);
  if (PD.status) fetch(PD.status + '?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : null)
    .then(s => { if (s && s.checked) render(s.checked); }).catch(() => {});
})();
</script>
